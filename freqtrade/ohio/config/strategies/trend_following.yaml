name: Trend Following
mode: trend_following
description: >
  Rides sustained directional moves. Seeks high trend persistence and
  relative strength. Avoids high liquidity stress and downside pressure.
  Uses trailing stops and moderate-to-high leverage.

preferences:
  trend_persistence:
    weight: 0.30
    ideal: 0.80        # strongly positive trend ([-1,1] axis mapped to target)
  relative_strength:
    weight: 0.25
    ideal: 0.75        # asset outperforming peers
  volatility_level:
    weight: 0.15
    ideal: 0.40        # moderate volatility — enough for movement, not chaos
  downside_pressure:
    weight: 0.15
    ideal: 0.10        # minimal downside pressure
  liquidity_stress:
    weight: 0.10
    ideal: 0.10        # liquid markets required for trend trades
  correlation_stress:
    weight: 0.03
    ideal: 0.30        # mild correlation acceptable
  breadth_dispersion:
    weight: 0.02
    ideal: 0.30        # broad participation preferred

meta_confidence_weight: 0.05
meta_stability_weight: 0.05

stoploss_range: [-0.12, -0.08]   # trailing — wider to let trends breathe
leverage_range: [2.0, 3.0]
